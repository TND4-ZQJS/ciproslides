  .slide-badge {

    background: rgba(0,0,0,0.6);
    color: #fff;
    font-family: sans-serif;
    font-size: 12px;
    padding: 5px 14px;
    border-radius: 20px;
    z-index: 9999;
    pointer-events: none;
  }

  .lock-indicator {
    position: fixed;
    top: 14px;
    right: 16px;
    background: rgba(200,40,40,0.9);
    color: #fff;
    font-family: sans-serif;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    z-index: 9999;
    pointer-events: none;
    display: none;
  }
  .lock-indicator.visible { display: block; }

  .reveal .progress { display: none; }
  .reveal .controls { display: none; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.js"></script>
<script>
  const LOCKED_SLIDES = new Set([0, 1]);
  const TOTAL = 10;

Reveal.initialize({
  hash: true,
  transition: 'fade',
  transitionSpeed: 'fast',
  
  // Set these to match your PDF page dimensions/aspect ratio
  width: 1440, 
  height: 1080,
  
  margin: 0,
  minScale: 0.1,
  maxScale: 2.0,
  controls: false,
  progress: false,
  center: true, // This leaves black bars on the sides of the desktop browser if needed, keeping your slide perfect
  embedded: false,
});

// Remove the window 'resize' event listener entirely! 
// Reveal.js will natively handle scaling now.
  // Resize handler — keep reveal filling the window
  window.addEventListener('resize', () => {
    Reveal.configure({ width: window.innerWidth, height: window.innerHeight });
  });

  function getCurrentIndex() {
    return Reveal.getState().indexh || 0;
  }

  Reveal.on('slidechanged', event => {
    const idx = event.indexh;
    document.getElementById('slideBadge').textContent = (idx + 1) + ' / ' + TOTAL;
    const lock = document.getElementById('lockIndicator');
    LOCKED_SLIDES.has(idx) ? lock.classList.add('visible') : lock.classList.remove('visible');
  });

  // Block keyboard on locked slides
  document.addEventListener('keydown', e => {
    if (LOCKED_SLIDES.has(getCurrentIndex())) {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }
  }, true);

  // Block swipe on locked slides
  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (LOCKED_SLIDES.has(getCurrentIndex())) {
      if (Math.abs(e.changedTouches[0].clientX - touchStartX) > 30) {
        setTimeout(() => Reveal.slide(getCurrentIndex()), 10);
      }
    }
  });

  Reveal.on('ready', () => {
    if (LOCKED_SLIDES.has(getCurrentIndex())) {
      document.getElementById('lockIndicator').classList.add('visible');
    }
  });
</script>
