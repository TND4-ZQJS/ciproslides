    width: 100% !important;
    height: 100% !important;
    top: 0 !important;

  .slide-container {

    height: 100%;

    display: block;
    cursor: pointer;
    z-index: 10;
    border-radius: 6px;
    transition: background 0.2s;
  }
  .hotspot:hover {
    background: rgba(255,255,255,0.15);

  }

  /* Slide counter badge */

    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-family: sans-serif;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    z-index: 100;
    pointer-events: none;
    letter-spacing: 0.5px;

  /* Lock icon indicator */

    top: 14px;
    right: 16px;
    background: rgba(220,50,50,0.85);
    color: #fff;
    font-family: sans-serif;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    z-index: 100;
    pointer-events: none;
    display: none;
  }
  .lock-indicator.visible { display: block; }

  /* Debug mode — show hotspot outlines */
  body.debug .hotspot {
    background: rgba(255, 0, 0, 0.2) !important;
    outline: 2px dashed red !important;
  }

  .reveal .progress { display: none; }
  .reveal .controls { display: none; }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.js"></script>
<script>
  const LOCKED_SLIDES = new Set([0, 1]);
  const TOTAL = 10;

  Reveal.initialize({
    hash: true,
    transition: 'fade',
    transitionSpeed: 'fast',
    width: '100%',
    height: '100%',
    margin: 0,
    minScale: 1,
    maxScale: 1,
    controls: false,
    progress: false,
    keyboard: true,
    touch: true,
    center: false,
  });

  function getCurrentIndex() {
    return Reveal.getState().indexh || 0;
  }

  Reveal.on('slidechanged', event => {
    const idx = event.indexh;
    document.getElementById('slideBadge').textContent = (idx + 1) + ' / ' + TOTAL;
    const lock = document.getElementById('lockIndicator');
    LOCKED_SLIDES.has(idx) ? lock.classList.add('visible') : lock.classList.remove('visible');
  });

  // Block keyboard on locked slides
  document.addEventListener('keydown', e => {
    if (LOCKED_SLIDES.has(getCurrentIndex())) {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }
  }, true);

  // Block swipe on locked slides
  let touchStartX = 0;
  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  document.addEventListener('touchend', e => {
    const idx = getCurrentIndex();
    if (LOCKED_SLIDES.has(idx)) {
      if (Math.abs(e.changedTouches[0].clientX - touchStartX) > 30) {
        setTimeout(() => Reveal.slide(idx), 10);
      }
    }
  });

  // Press D to toggle debug mode (shows hotspot outlines)
  document.addEventListener('keydown', e => {
    if (e.key === 'd' || e.key === 'D') {
      document.body.classList.toggle('debug');
    }
  });

  Reveal.on('ready', () => {
    const idx = getCurrentIndex();
    if (LOCKED_SLIDES.has(idx)) {
      document.getElementById('lockIndicator').classList.add('visible');
    }
  });
</script>
