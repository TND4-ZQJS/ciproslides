<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  /* ── Splash screen ── */
  #splash {
    position: fixed;
    inset: 0;
    background: #111;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    cursor: pointer;
    user-select: none;
  }
  #splash h1 {
    color: #fff;
    font-family: sans-serif;
    font-size: clamp(22px, 4vw, 42px);
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  #splash p {
    color: #aaa;
    font-family: sans-serif;
    font-size: clamp(13px, 2vw, 18px);
    margin-bottom: 40px;
  }
  #splash .btn {
    background: #e02020;
    color: #fff;
    font-family: sans-serif;
    font-size: clamp(14px, 2vw, 20px);
    padding: 14px 40px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #splash .btn:hover { background: #c01010; }

  /* ── Rotate overlay ── */
  #rotateOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.93);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 88888;
  }
  #rotateOverlay.show { display: flex; }
  #rotateOverlay span {
    font-size: 64px;
    animation: spin 2s linear infinite;
  }
  #rotateOverlay p {
    color: #fff;
    font-family: sans-serif;
    font-size: 18px;
    margin-top: 20px;
    text-align: center;
    padding: 0 30px;
  }
  @keyframes spin {
    0%   { transform: rotate(0deg); }
    25%  { transform: rotate(90deg); }
    50%  { transform: rotate(90deg); }
    75%  { transform: rotate(0deg); }
    100% { transform: rotate(0deg); }
  }

  /* ── Reveal slides ── */
  .reveal .slides section {
    padding: 0 !important;
  }

  .slide-wrap {
    position: relative;
    width: 1600px;
    height: 900px;
  }

  .slide-wrap img {
    width: 1600px;
    height: 900px;
    object-fit: fill;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Hotspots — positioned in 1600x900 space, scale with Reveal */
  .hotspot {
    position: absolute;
    display: block;
    cursor: pointer;
    z-index: 999;
    border-radius: 6px;
    -webkit-tap-highlight-color: transparent;
  }
  .hotspot:hover { background: rgba(255,255,255,0.15); }
  .hotspot:active { background: rgba(255,255,255,0.3); }

  /* Debug mode — press D */
  body.debug .hotspot {
    background: rgba(255,0,0,0.25) !important;
    outline: 2px dashed red !important;
  }

  /* UI badges */
  .slide-badge {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-family: sans-serif;
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    z-index: 9999;
    pointer-events: none;
  }

  .lock-indicator {
    position: fixed;
    top: 12px;
    right: 14px;
    background: rgba(200,40,40,0.9);
    color: #fff;
    font-family: sans-serif;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    z-index: 9999;
    pointer-events: none;
    display: none;
  }
  .lock-indicator.visible { display: block; }

  /* Fullscreen button */
  #fsBtn {
    position: fixed;
    bottom: 14px;
    right: 14px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-family: sans-serif;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    z-index: 9999;
    border: none;
    cursor: pointer;
  }
  #fsBtn:hover { background: rgba(255,255,255,0.2); }

  .reveal .progress { display: none; }
  .reveal .controls { display: none; }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.6.1/reveal.min.js"></script>
<script>
  const LOCKED_SLIDES = new Set([0, 1]);
  const TOTAL = 10;

  // ── Reveal init ──
  Reveal.initialize({
    hash: true,
    transition: 'fade',
    transitionSpeed: 'fast',
    width: 1600,
    height: 900,
    margin: 0,
    minScale: 0.1,
    maxScale: 1.0,
    controls: false,
    progress: false,
    center: true,
  });

  // ── Slide changed ──
  Reveal.on('slidechanged', event => {
    const idx = event.indexh;
    document.getElementById('slideBadge').textContent = (idx + 1) + ' / ' + TOTAL;
    const lock = document.getElementById('lockIndicator');
    LOCKED_SLIDES.has(idx) ? lock.classList.add('visible') : lock.classList.remove('visible');
  });

  Reveal.on('ready', () => {
    const idx = Reveal.getState().indexh || 0;
    if (LOCKED_SLIDES.has(idx)) document.getElementById('lockIndicator').classList.add('visible');
  });

  function getCurrentIndex() { return Reveal.getState().indexh || 0; }

  // ── Block keyboard on locked slides ──
  document.addEventListener('keydown', e => {
    if (LOCKED_SLIDES.has(getCurrentIndex())) {
      if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }
    // D = debug mode
    if (e.key === 'd' || e.key === 'D') document.body.classList.toggle('debug');
  }, true);

  // ── Block swipe on locked slides ──
  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (LOCKED_SLIDES.has(getCurrentIndex())) {
      if (Math.abs(e.changedTouches[0].clientX - touchStartX) > 30) {
        setTimeout(() => Reveal.slide(getCurrentIndex()), 10);
      }
    }
  });

  // ── Splash + fullscreen + orientation ──
  function startPresentation() {
    document.getElementById('splash').style.display = 'none';

    // Try fullscreen
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.mozRequestFullScreen) el.mozRequestFullScreen();

    // Try orientation lock (Android Chrome, some tablets)
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }

    checkOrientation();
  }

  // ── Fullscreen button ──
  function toggleFS() {
    const btn = document.getElementById('fsBtn');
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      btn.textContent = '✕ Exit';
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      btn.textContent = '⛶ Fullscreen';
    }
  }

  document.addEventListener('fullscreenchange', () => {
    const btn = document.getElementById('fsBtn');
    btn.textContent = document.fullscreenElement ? '✕ Exit' : '⛶ Fullscreen';
  });
  document.addEventListener('webkitfullscreenchange', () => {
    const btn = document.getElementById('fsBtn');
    btn.textContent = document.webkitFullscreenElement ? '✕ Exit' : '⛶ Fullscreen';
  });

  // ── Orientation check ──
  function checkOrientation() {
    const overlay = document.getElementById('rotateOverlay');
    const isPortrait = window.innerHeight > window.innerWidth;
    if (isPortrait) {
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
    }
  }

  window.addEventListener('resize', checkOrientation);
  window.addEventListener('orientationchange', () => {
    setTimeout(checkOrientation, 300);
  });
</script>
